<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Factura</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <hr id="horizontal-bar">
    <div class="title-box">
        <div class="business-info">
            <h2 id="business-name">PRODUCTOS DE LIMPIEZA V&G</h2>
            <p>Bonao, Simon Bolivar, C/ Manuela Saenz, #63</p>
            <p>Fecha: 12/02/2020</p>
        </div>
        <div class="factura-consumo">
            <h1>Factura de Consumo</h1>
        </div>
    </div>
    <hr>
    <table>
        <thead>
            <tr>
                <th scope="col">CANT.</th>
                <th scope="col">DESCRIPCIÓN</th>
                <th scope="col">VALOR</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1x100</td>
                <td>Cloro</td>
                <td>100</td>
            </tr>
            <tr>
                <td>1x180</td>
                <td>Jabón de Cuaba</td>
                <td>180</td>
            </tr>
        </tbody>
    </table>
    <hr>
    <div id="total-box">
        <p>SUBTOTAL</p>
        <p>DESC.</p>
        <p id="total-p">TOTAL</p>
    </div>
</body>

</html>
